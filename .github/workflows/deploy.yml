name: Deploy fb-auto-launch-demo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 3. Add server to known hosts
      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 4. Deploy
      - name: Deploy to server
        run: |
          ssh root@${{ secrets.SERVER_IP }} << 'EOF'

          set -e

          cd /var/www/fb-auto-launch-demo

          echo "Pulling latest code..."
          git pull origin main

          echo "Installing root dependencies..."
          npm install

          echo "Building frontend (demo)..."
          rm -rf demo-dist
          npx vite build --config vite.demo.config.ts

          echo "Building backend..."
          cd server
          npm install
          npm run build

          echo "Restarting backend..."
          pm2 restart fb-auto-launch-demo || pm2 start dist/index.js --name fb-auto-launch-demo

          echo "Done."
          EOF