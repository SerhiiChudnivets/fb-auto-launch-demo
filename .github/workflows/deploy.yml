name: Deploy fb-auto-launch

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync project to server (SAFE MODE)
        run: |
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude server/mock-data \
            --exclude demo-dist \
            ./ root@${{ secrets.SERVER_IP }}:/var/www/fb-auto-launch-demo

      - name: Build & restart on server
        run: |
          ssh root@${{ secrets.SERVER_IP }} << 'EOF'

          set -e

          cd /var/www/fb-auto-launch-demo

          echo "Installing dependencies..."
          npm install

          echo "Building frontend..."
          rm -rf demo-dist
          npx vite build --config vite.demo.config.ts

          echo "Building backend..."
          cd server
          npm install
          npm run build

          echo "Restarting API..."
          pm2 restart fb-auto-launch-demo || pm2 start dist/index.js --name fb-auto-launch-demo

          EOF